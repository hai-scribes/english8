const BY_ID = Object.fromEntries(WORDS.map(w => [w.id, w]));
const ROUNDS = [1,2,3].map(n => WORDS.filter(w => w.round === n));
const NEW_PER_ROUND = 6;

/* Leitner-style interval ladder, in days. Step 0 = just introduced. */
const INTERVALS = [1,3,7,14,30];
function intervalForStep(step){
  if (step < INTERVALS.length) return INTERVALS[step];
  let d = INTERVALS[INTERVALS.length - 1];
  for (let i = INTERVALS.length; i <= step; i++) d = Math.min(90, d * 2);
  return d;
}

/* ---------- dates as local day strings (DST-safe) ---------- */
function fmtDay(d){
  const p = n => String(n).padStart(2,"0");
  return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate());
}
function today(){ return fmtDay(new Date()); }
function addDays(day, n){
  const [y,m,d] = day.split("-").map(Number);
  const dt = new Date(y, m-1, d, 12, 0, 0); // noon anchor
  dt.setDate(dt.getDate() + n);
  return fmtDay(dt);
}

/* ---------- persistent progress ---------- */
function blankRecord(){
  return { introduced:null, due:null, step:0, lastReviewed:null,
           attempts:0, correct:0, lapses:0,
           receptive:0, productive:0, listening:0,
           delayedSuccesses:0, durable:false };
}
let STATE = loadState();

function loadState(){
  let raw = null;
  try { raw = localStorage.getItem(STORE_KEY); } catch(e){ raw = null; }
  let s = null;
  if (raw){ try { s = JSON.parse(raw); } catch(e){ s = null; } }
  if (!s || typeof s !== "object" || s.contentVersion !== CONTENT_VERSION){
    s = { contentVersion:CONTENT_VERSION, words:{}, testsTaken:0, lastSession:null };
  }
  if (!s.words) s.words = {};
  for (const w of WORDS) if (!s.words[w.id]) s.words[w.id] = blankRecord();
  return s;
}
let saveWarned = false;
function saveState(){
  try { localStorage.setItem(STORE_KEY, JSON.stringify(STATE)); }
  catch(e){
    if (!saveWarned){
      saveWarned = true;
      alert("Progress can't be saved in this browser (storage is blocked or full). "
          + "You can keep practising, but today's results will be lost when you close the tab.");
    }
  }
}
const rec = id => STATE.words[id];
const isIntroduced = id => !!rec(id).introduced;
const introducedWords = () => WORDS.filter(w => isIntroduced(w.id));
const dueWords = () => WORDS.filter(w => isIntroduced(w.id) && rec(w.id).due && rec(w.id).due <= today());
const newWordsLeft = () => WORDS.filter(w => !isIntroduced(w.id));
function nextRound(){
  for (const r of ROUNDS) if (r.some(w => !isIntroduced(w.id))) return r.filter(w => !isIntroduced(w.id));
  return [];
}
const durableCount = () => WORDS.filter(w => rec(w.id).durable).length;
const acquiredTodayCount = () => WORDS.filter(w => rec(w.id).introduced === today()).length;

/* Advance / reset an item's schedule after a graded retrieval. */
function grade(id, ok, dimension){
  const r = rec(id);
  const t = today();
  r.attempts++;
  const wasDelayed = r.lastReviewed && r.lastReviewed !== t;
  r.lastReviewed = t;
  if (ok){
    r.correct++;
    if (dimension) r[dimension]++;
    if (wasDelayed){
      r.delayedSuccesses++;
      r.step = Math.min(r.step + 1, 12);
    }
    r.due = addDays(t, intervalForStep(r.step));
    if (r.delayedSuccesses >= 3 && r.productive >= 1) r.durable = true;
  } else {
    r.lapses++;
    r.step = 0;
    r.durable = false;
    r.delayedSuccesses = 0;
    r.due = addDays(t, 1);
  }
  saveState();
}

/* ============================================================
   Speech

   The voice IS the pronunciation model, so it is chosen, not accepted.
   getVoices() returns an unranked list and the old code took the first
   en-GB match — on macOS that is a coin flip across nine en-GB voices of
   which exactly one (Daniel) is a neutral speaker; the other eight are
   Apple's stylised set (Grandpa, Rocko, Shelley, Flo...). A cartoon voice
   is not a pronunciation model.

   Ranking, in order of weight:
     1. Never a character voice, in any accent.
     2. Prefer en-GB. This unit teaches British IPA, and a US voice
        contradicts the table printed beside it: US "leisure" is /ˈliːʒər/,
        which rhymes with the exact word the note says it does not rhyme
        with, and "craft" is /kræft/ against the table's /krɑːft/.
     3. Prefer a neural/enhanced voice over a compact one.

   Read the honest limit in NOT_A_LENGTH_MODEL below before trusting this
   audio for the /ʊ/ vs /uː/ contrast.
   ============================================================ */
const RATE_NORMAL = 1.0;   // the natural-speed reference
const RATE_SLOW   = 0.6;   // deliberate replay, on request only

/* Apple's stylised/novelty voices — present in en-GB and en-US alike. */
const CHARACTER_VOICE = /\b(albert|bad news|bahh|bells|boing|bubbles|cellos|eddy|flo|fred|good news|grandma|grandpa|jester|junior|kathy|organ|ralph|reed|rocko|sandy|shelley|superstar|trinoids|whisper|wobble|zarvox)\b/i;
/* Name fragments that mark the high-fidelity path on each platform. */
const NEURAL_VOICE    = /(natural|neural|enhanced|premium|siri|google|online)/i;
/* Neutral news-reader voices shipped by Apple, Microsoft and Google. */
const NEUTRAL_VOICE   = /\b(daniel|kate|serena|libby|sonia|ryan|arthur|oliver|hazel|george|martha)\b/i;

const TTS = { ready:false, voice:null, british:false, failed:false,
              supported:("speechSynthesis" in window) };
let onVoicesReady = null;   // installed by the UI once it exists

function scoreVoice(v){
  const lang = String(v.lang || "").replace("_", "-");
  if (!/^en\b/i.test(lang)) return -Infinity;
  const name = String(v.name || "");
  let s = 0;
  if (/^en-GB/i.test(lang)) s += 100;
  else if (/^en-(IE|AU|NZ|ZA)/i.test(lang)) s += 40;
  else s += 20;
  /* Outweighs the accent bonus, so a plain US voice beats a character GB
     one — but stays finite, so a character voice is still better than
     silence on a machine that has nothing else. */
  if (CHARACTER_VOICE.test(name)) s -= 200;
  if (NEURAL_VOICE.test(name))    s += 50;
  if (NEUTRAL_VOICE.test(name))   s += 25;
  if (/compact/i.test(name))      s -= 15;
  if (v.localService === false)   s += 5;
  return s;
}
function pickVoice(){
  if (!TTS.supported) return null;
  const vs = speechSynthesis.getVoices() || [];
  let best = null, bestScore = -Infinity;
  for (const v of vs){
    const s = scoreVoice(v);
    if (s > bestScore){ best = v; bestScore = s; }
  }
  return bestScore === -Infinity ? null : best;
}
function refreshVoice(){
  const was = TTS.ready;
  TTS.voice = pickVoice();
  TTS.ready = !!TTS.voice;
  TTS.british = !!(TTS.voice && /^en[-_]GB/i.test(TTS.voice.lang));
  return TTS.ready !== was;
}
if (TTS.supported){
  refreshVoice();
  /* Chrome returns an empty list on the first call and fills it
     asynchronously. Without a repaint the home screen keeps claiming there
     is no voice, and every review session keeps skipping listening prompts,
     for the whole session. */
  speechSynthesis.addEventListener("voiceschanged", () => {
    if (refreshVoice() && onVoicesReady) onVoicesReady();
  });
}
function canListen(){ return TTS.supported && TTS.ready && !TTS.failed; }

/* iOS Safari will only start synthesis that descends from a user gesture.
   A silent utterance on the first click buys every later programmatic
   speak() the same permission. */
let speechPrimed = false;
function primeSpeech(){
  if (speechPrimed || !TTS.supported) return;
  speechPrimed = true;
  try {
    const u = new SpeechSynthesisUtterance(" ");
    u.volume = 0;
    speechSynthesis.speak(u);
  } catch(e){ /* priming is best-effort */ }
}

let speakTimer = null, speakTurn = 0;
function speak(text, opts){
  if (!TTS.supported || !text) return false;
  opts = opts || {};
  try {
    const mine = ++speakTurn;
    if (speakTimer){ clearTimeout(speakTimer); speakTimer = null; }
    speechSynthesis.cancel();
    /* A cancel() landing mid-word can leave Chrome's engine paused, and a
       paused engine accepts utterances without ever playing them. */
    if (speechSynthesis.paused) speechSynthesis.resume();
    /* Chrome drops an utterance queued in the same tick as cancel(); one
       frame of separation is enough to make it reliable. A fixed frame is
       not enough on WebKit, which keeps a queued-but-unstarted utterance
       alive across cancel() — so a learner tapping 🔊 twice gets the second
       reading laid over the first. Wait for the engine to actually fall
       idle, capped so a stuck engine still gets its one attempt. */
    let waited = 0;
    const fire = () => {
      speakTimer = null;
      if (mine !== speakTurn) return;          // a later tap already won
      if ((speechSynthesis.speaking || speechSynthesis.pending) && waited < 600){
        waited += 40; speakTimer = setTimeout(fire, 40); return;
      }
      const u = new SpeechSynthesisUtterance(text);
      if (TTS.voice){ u.voice = TTS.voice; u.lang = TTS.voice.lang; } else { u.lang = "en-GB"; }
      u.rate = opts.slow ? RATE_SLOW : RATE_NORMAL;
      u.pitch = 1;
      u.volume = 1;
      u.onerror = ev => {
        /* "interrupted" and "canceled" are our own cancel() calls landing,
           not a broken voice. Anything else means the audio path is dead
           and listening prompts must stop being offered. */
        const err = ev && ev.error;
        if (err === "interrupted" || err === "canceled") return;
        TTS.failed = true;
      };
      speechSynthesis.speak(u);
    };
    speakTimer = setTimeout(fire, 60);
    return true;
  } catch(e){ return false; }
}
const sayText = w => w.speak || w.word.replace(/\s*\(.*?\)\s*/g, " ").trim();

/* Measured, not assumed: on this machine the en-GB voices render the
   /ʊ/-/uː/ pair with a 1-3% duration difference, and Daniel — the voice
   the ranking above picks — renders "full" LONGER than "fool", i.e.
   backwards. The unit teaches that /uː/ is held about twice as long.
   So the audio is a reliable model of word identity and stress, and is
   NOT a model of vowel length. Words that turn on that contrast say so. */
const NOT_A_LENGTH_MODEL =
  "Computer voices do not reliably hold /uː/ longer than /ʊ/ — some make it "
+ "shorter. Use 🔊 to check <i>which</i> word this is; use the IPA "
+ "and the note above for <i>how long</i> the vowel is.";

/* ---------- answer checking ---------- */
function norm(s){
  return String(s == null ? "" : s)
    .normalize("NFC").toLowerCase()
    .replace(/[’‘`´]/g, "'")
    .replace(/[.,!?;:]+$/g, "")
    .replace(/\s+/g, " ")
    .trim();
}
function checkTyped(input, accept){
  const a = norm(input);
  if (!a) return false;
  return accept.some(x => norm(x) === a);
}

/* ---------- small helpers ---------- */
function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
const pick = a => a[Math.floor(Math.random() * a.length)];
function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function clozeHTML(text){ return esc(text).replace(/___/g, '<span class="gap"></span>'); }

/* Distractor glosses: same part of speech where possible, never a word from
   the same meaning group (leisure/pastime, hang out/socialise, ...). */
function distractors(word, n){
  const sameGroup = w => w.syn === word.syn;
  const pool = WORDS.filter(w => w.id !== word.id && !sameGroup(w));
  const samePos = shuffle(pool.filter(w => w.pos === word.pos));
  const rest = shuffle(pool.filter(w => w.pos !== word.pos));
  return samePos.concat(rest).slice(0, n);
}

/* ---------- prompt construction ---------- */
/* formats:
   mc-meaning     English word (+audio) -> choose the Vietnamese meaning   [receptive]
   recall-meaning English word -> think, reveal, self-mark                 [receptive]
   type-word      Vietnamese + part of speech -> type the English word     [productive]
   cloze          sentence with a gap -> type the English word             [productive]
   listen-type    audio only -> type the English word                      [listening] */
const DIMENSION = {
  "mc-meaning":"receptive", "recall-meaning":"receptive",
  "type-word":"productive", "cloze":"productive", "listen-type":"listening"
};
function buildPrompt(word, format){
  const p = { format, wordId:word.id, dimension:DIMENSION[format] };
  if (format === "mc-meaning"){
    const opts = shuffle(distractors(word, 3).map(w => ({ text:w.vi, ok:false }))
                  .concat([{ text:word.vi, ok:true }]));
    p.options = opts;
  } else if (format === "cloze"){
    p.sentence = pick(word.cloze).t;
  }
  return p;
}

/* ============================================================
   Session engines
   ============================================================ */

/* --- learn round: exposure, then early interleaved retrieval --- */
function LearnRound(words){
  /* Four rungs, easiest first, each a step up in retrieval effort. A word
     leaves the round only after clearing all four — recognise the meaning,
     recall the meaning, produce the form, then produce it inside a sentence.
     Listening prompts belong to review, once the form is stable. */
  const ladder = ["mc-meaning","recall-meaning","type-word","cloze"];
  const MAX_PROMPTS = 14;
  const st = {};
  for (const w of words) st[w.id] = { rung:0, s:0, receptive:0, productive:0, prompts:0, notBefore:0, done:false };
  // Phase A: expose 3, then interleave each first retrieval 2-3 items behind.
  const opening = [];
  const q = words.slice();
  const pendingFirst = [];
  q.forEach((w, i) => {
    opening.push({ kind:"expose", wordId:w.id });
    pendingFirst.push(w.id);
    if (i >= 2) opening.push({ kind:"prompt", wordId:pendingFirst.shift(), first:true });
  });
  while (pendingFirst.length) opening.push({ kind:"prompt", wordId:pendingFirst.shift(), first:true });

  let step = 0, lastId = null;
  return {
    mode:"learn",
    words,
    total: words.length,
    doneCount(){ return words.filter(w => st[w.id].done).length; },
    /* The bar fills on rungs cleared, so it moves on every success, while the
       label only counts words that are actually finished. */
    frac(){
      const cleared = words.reduce((n, w) => n + (st[w.id].done ? ladder.length : st[w.id].rung), 0);
      return cleared / (words.length * ladder.length);
    },
    next(){
      step++;
      if (opening.length){
        const t = opening.shift();
        if (t.kind === "expose"){ lastId = t.wordId; return { kind:"expose", word:BY_ID[t.wordId] }; }
        lastId = t.wordId;
        const s = st[t.wordId]; s.prompts++;
        return { kind:"prompt", prompt:buildPrompt(BY_ID[t.wordId], ladder[s.rung]) };
      }
      const open = words.filter(w => !st[w.id].done);
      if (!open.length) return null;
      let elig = open.filter(w => st[w.id].notBefore <= step && w.id !== lastId);
      if (!elig.length) elig = open.filter(w => w.id !== lastId);
      if (!elig.length) elig = open;
      elig.sort((a,b) => st[a.id].s - st[b.id].s || st[a.id].prompts - st[b.id].prompts);
      const w = elig[0];
      const s = st[w.id];
      s.prompts++;
      lastId = w.id;
      const fmt = ladder[Math.min(s.rung, ladder.length - 1)];
      return { kind:"prompt", prompt:buildPrompt(w, fmt) };
    },
    record(prompt, ok){
      const s = st[prompt.wordId];
      grade(prompt.wordId, ok, ok ? prompt.dimension : null);
      if (ok){
        s.s++;
        if (prompt.dimension === "receptive") s.receptive++;
        if (prompt.dimension === "productive") s.productive++;
        if (s.rung < ladder.length) s.rung++;
      } else {
        s.notBefore = step + 3;   // don't re-ask while the answer is still in mind
      }
      /* Criterion: every rung cleared — four separated successes, at least one
         receptive and at least one productive. The cap stops a word the learner
         is clearly not ready for from eating the whole session; it comes back
         tomorrow either way. */
      if (s.rung >= ladder.length || s.prompts >= MAX_PROMPTS) s.done = true;
    }
  };
}

/* --- review session: due words from earlier days --- */
function ReviewRound(words){
  const queue = shuffle(words).map(w => w.id);
  const retry = [];
  const retried = new Set();   // each word gets at most one second chance per session
  const seen = new Set();
  const total = queue.length;
  return {
    mode:"review",
    total,
    doneCount(){ return seen.size; },
    next(){
      let id = queue.shift();
      if (id === undefined){
        if (!retry.length) return null;
        id = retry.shift();
      }
      const w = BY_ID[id], r = rec(id);
      let fmt;
      if (r.productive === 0) fmt = "type-word";
      else if (r.listening === 0 && canListen()) fmt = "listen-type";
      else if (r.durable) fmt = pick(canListen() ? ["cloze","listen-type","type-word"] : ["cloze","type-word"]);
      else fmt = pick(["recall-meaning","type-word","cloze"]);
      return { kind:"prompt", prompt:buildPrompt(w, fmt) };
    },
    record(prompt, ok){
      grade(prompt.wordId, ok, ok ? prompt.dimension : null);
      seen.add(prompt.wordId);
      if (!ok && !retried.has(prompt.wordId)){
        retried.add(prompt.wordId);
        retry.push(prompt.wordId);
      }
    }
  };
}

/* --- scored check: every introduced word once, freshly generated --- */
/* Roughly half receptive (recognise the meaning), half productive (produce the
   form). Only auto-gradable formats are used, so the score means something. */
function buildTest(words){
  return shuffle(words).map((w, i) => {
    let fmt;
    if (i % 2 === 0) fmt = "mc-meaning";
    else if (canListen() && i % 5 === 3) fmt = "listen-type";
    else fmt = pick(["type-word","cloze"]);
    return buildPrompt(w, fmt);
  });
}

     the answer changes what they should trust. A US voice is not a small

           + 'Everything else works. On a phone, try Chrome or Safari.</p>';
  } else if (TTS.failed){
    notice = '<p class="notice">The speech voice stopped responding, so listening questions are switched off '
           + 'for now. Reload the page to try again.</p>';
  } else if (!TTS.ready){
    notice = '<p class="notice">No English speech voice is available in this browser, so listening questions are '
           + 'switched off. Everything else works. On a phone, try Chrome or Safari.</p>';
  } else if (!TTS.british){
    notice = '<p class="notice">Reading the words with <b>' + esc(TTS.voice.name) + '</b> ('
           + esc(TTS.voice.lang) + '). This unit teaches British pronunciation, so a few words will not '
           + 'match the IPA on the card — <i>leisure</i>, <i>craft</i>, <i>pastime</i> and <i>can\'t</i> '
           + 'are the ones to watch. Installing a British English voice fixes it.</p>';
  }
  return '<div class="stats">'
    + stat(due.length, "due today")
    + stat(acquiredTodayCount(), "learned today")
    + stat(durableCount(), "known well")
    + '</div>'
    + '</div>'
    + vocabPanel(bar, nr)
    + '<div class="menu" style="margin-top:14px">' + cards.join("") + '</div>'
    + notice;
}

/* ---- the new-vocabulary list, and the way into the learning mode ----
   This is the page's centre of gravity: the 18 words of Lesson 2, grouped
   into the rounds they are actually taught in, each showing where the
   learner stands with it. The button that starts the mode sits inside this
   section, above the list it applies to, so it is obvious which words it is
   about to teach. */
function wordStatus(w){
  const r = rec(w.id);
  if (!r.introduced) return { k:"new", label:"not started" };
  if (r.durable) return { k:"known", label:"known well" };
  if (r.due && r.due <= today()) return { k:"due", label:"due today" };
  return { k:"learning", label:"learning" };
}
function vocabPanel(bar, nr){
  const done = durableCount();
  const cta = nr.length
    ? '<button class="btn-primary cta" type="button" data-act="learn">'
        + 'Learn the next ' + nr.length + ' words'
        + '<span class="cta-sub">' + esc(nr.map(w => w.word).join(" · ")) + '</span></button>'
    : '<button class="btn-primary cta" type="button" data-act="learn" disabled>'
        + 'All 18 words started'
        + '<span class="cta-sub">Nothing new left to meet — use Review and the practice test to make them stick</span></button>';
  const groups = ROUNDS.map((r, i) => {
    const states = r.map(wordStatus);
    const summary = states.every(s => s.k === "new") ? "not started yet"
      : states.every(s => s.k === "known") ? "all known well"
      : states.filter(s => s.k !== "new").length + " of " + r.length + " started";
    return '<h3 class="vround"><span>Round ' + (i + 1) + '</span><span>' + esc(summary) + '</span></h3>'
      + '<ol class="vocab">' + r.map((w, j) => vocabRow(w, i * 6 + j + 1)).join("") + '</ol>';
  }).join("");
  return '<div class="panel">'
    + '<h2>The 18 new words</h2>'
    + '<p class="small muted">Lesson 2 vocabulary, taught six at a time. Words that are easy to '
    + 'confuse with each other are deliberately split across different rounds.</p>'
    + cta
    + '<div class="dl" style="border-top:0;padding-top:16px">' + bar
    + '<p class="tiny muted" style="margin-top:2px">A word counts as <b>known well</b> after you recall it '
    + 'correctly on three different days, including once from Vietnamese into English. '
    + '<b>' + done + '</b> of ' + WORDS.length + ' so far.</p></div>'
    + groups
    + '</div>';
}
function vocabRow(w, n){
  const s = wordStatus(w);
  const audio = TTS.supported
    ? '<button class="speak mini" type="button" data-act="say" data-id="' + w.id
      + '" aria-label="Hear ' + esc(w.word) + '">🔊</button>' : "";
  return '<li class="vrow">'
    + '<span class="vnum">' + n + '</span>'
    + '<span class="vmain"><span class="vword">' + esc(w.word) + '</span> '
      + '<span class="ipa vipa">' + esc(w.ipa) + '</span>'
      + '<span class="vvi">' + esc(w.vi) + '</span></span>'
    + '<span class="vstat s-' + s.k + '">' + esc(s.label) + '</span>'
    + audio + '</li>';
}
function stat(n, label){ return '<div class="stat"><b>' + n + '</b><span>' + esc(label) + '</span></div>'; }
function cardBtn(act, title, pill, desc, disabled){
  return '<button class="card-btn" type="button" data-act="' + act + '"' + (disabled ? " disabled" : "") + '>'
    + '<span class="t">' + esc(title) + '<span class="pill">' + esc(pill) + '</span></span>'
    + '<span class="d">' + esc(desc) + '</span></button>';
}
function progressBar(label, right, frac){
  const pct = Math.max(0, Math.min(100, Math.round(frac * 100)));
  return '<div class="prog"><div class="lbl"><span>' + esc(label) + '</span><span>' + esc(right) + '</span></div>'
    + '<div class="bar"><div class="fill" style="width:' + pct + '%"></div></div></div>';
}

/* ---- word card (exposure) ---- */
/* Two buttons, not one. A single slowed-down button (the old behaviour: every
   utterance at rate 0.88) leaves the learner no natural-speed reference,
   which is the only speed they will ever meet the word at. Natural is the
   default; the slow replay is there on request. */
function audioButtons(id, inline){
  /* canListen(), not TTS.supported: a browser can support the API and still
     have no English voice installed, and a speaker button that plays nothing
     reads to the learner as a broken app rather than a missing voice. The
     home screen explains the absence; here it simply does not appear. */
  if (!canListen()) return "";
  const style = inline ? "" : ' style="margin-left:0"';
  return '<button class="speak" type="button" data-act="say" data-id="' + id + '"' + style + '>🔊 Hear it</button>'
       + '<button class="speak" type="button" data-act="say-slow" data-id="' + id + '">🐢 Slowly</button>';
}
function wordCardHTML(w, opts){
  opts = opts || {};
  const lengthWarn = w.lengthPair && canListen()
    ? '<p class="tiny notice">' + NOT_A_LENGTH_MODEL + '</p>' : "";
  return '<p class="word">' + esc(w.word) + ' <span class="pos">' + esc(w.pos) + '</span>'
      + audioButtons(w.id, true) + '</p>'
    + '<div class="ipa">' + esc(w.ipa) + '</div>'
    + '<p class="gloss">' + esc(w.vi) + '</p>'
    + '<p class="small muted">' + esc(w.en) + '</p>'
    + (opts.hideDetail ? "" :
        '<div class="dl"><h3>Examples</h3><ul class="ex"><li>' + w.examples.join("</li><li>") + '</li></ul></div>'
      + '<div class="dl"><h3>Goes with</h3><div class="chips"><span class="chip">'
        + w.colloc.map(esc).join('</span><span class="chip">') + '</span></div></div>'
      + '<div class="dl"><h3>Watch out</h3><p class="small">' + w.note + '</p>' + lengthWarn + '</div>');
}
function viewExpose(){
  const w = UI.word, e = UI.engine;
  return sessionProgress(e)
    + '<div class="panel"><div class="kicker">New word</div>' + wordCardHTML(w) + '</div>'
    + '<div class="btn-row end"><button class="btn-primary" type="button" data-act="next" data-autofocus>'
    + 'Got it — next</button></div>'
    + '<p class="tiny muted" style="margin-top:10px">You will be asked to use this word in a moment. '
    + 'Reading it once is not learning it — the questions are.</p>';
}
function sessionProgress(e){
  if (!e) return "";
  if (e.mode === "learn")
    return progressBar("Words finished in this round", e.doneCount() + " of " + e.total, e.frac());
  return progressBar("Words reviewed", e.doneCount() + " of " + e.total, e.doneCount() / e.total);
}

/* ---- prompt ---- */
function viewPrompt(){
  const p = UI.prompt, w = BY_ID[p.wordId], e = UI.engine;
  let body = "", kicker = "", helper = "";
  if (p.format === "mc-meaning"){
    kicker = "What does it mean?";
    body = '<p class="prompt-q">' + esc(w.word) + '</p><div class="ipa">' + esc(w.ipa) + '</div>'
      + (canListen() ? '<div style="margin-top:8px">' + audioButtons(w.id) + '</div>' : "")
      + '<div class="choices">'
      + p.options.map((o,i) => '<button class="choice" type="button" data-act="choose" data-i="' + i + '"'
          + (i === 0 ? " data-autofocus" : "") + '>' + esc(o.text) + '</button>').join("")
      + '<button class="choice" type="button" data-act="choose" data-i="-1">I don\'t know</button></div>';
  } else if (p.format === "recall-meaning"){
    kicker = "Meaning check";
    body = '<p class="prompt-q">' + esc(w.word) + '</p><div class="ipa">' + esc(w.ipa) + '</div>'
      + '<p class="small muted" style="margin-top:12px">Say the Vietnamese meaning out loud, then check yourself.</p>'
      + '<div class="btn-row"><button class="btn-primary" type="button" data-act="reveal" data-autofocus>Show the answer</button></div>';
  } else if (p.format === "type-word"){
    kicker = "Write the English word";
    body = '<p class="prompt-q">' + esc(w.vi) + '</p>'
      + '<p class="small muted">' + esc(w.pos) + '</p>'
      + typedInput("Your answer");
  } else if (p.format === "cloze"){
    kicker = "Fill the gap";
    body = '<p class="prompt-q">' + clozeHTML(p.sentence) + '</p>'
      + '<p class="small muted">' + esc(w.vi) + ' · ' + esc(w.pos) + '</p>'
      + typedInput("The missing word");
  } else if (p.format === "listen-type"){
    kicker = "Listen and write";
    body = '<p class="small muted">Play the word and write what you hear. Play it as often as you like.</p>'
      + '<div style="margin:12px 0">'
      + '<button class="speak" type="button" data-act="say" data-id="' + w.id + '" style="margin-left:0">🔊 Play again</button>'
      + '<button class="speak" type="button" data-act="say-slow" data-id="' + w.id + '">🐢 Slowly</button></div>'
      + typedInput("What you heard");
    /* An audio-only question with no audio is unanswerable, and silent
       failure is common: a blocked autoplay policy, a voice that dies
       mid-session, headphones on the wrong device. Offer the same word
       from its meaning instead of letting the learner burn a lapse. */
    helper = '<p class="tiny muted" style="margin-top:12px">Nothing playing? '
      + '<button type="button" data-act="noaudio" style="padding:2px 8px;font-size:.78rem;border-radius:8px">'
      + 'Answer from the meaning instead</button></p>';
    setTimeout(() => speak(sayText(w)), 220);
  }
  return sessionProgress(e)
    + '<div class="panel"><div class="kicker">' + esc(kicker) + '</div>' + body + helper + '</div>'
    + (p.format === "recall-meaning" || p.format === "mc-meaning" ? ""
      : '<div class="btn-row end"><button class="btn-primary" type="button" data-act="submit">Check</button></div>');
}
function typedInput(label){
  return '<div style="margin-top:14px"><label class="field" for="ans">' + esc(label) + '</label>'
    + '<input id="ans" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" '
    + 'spellcheck="false" data-autofocus></div>';
}

/* ---- feedback ---- */
function viewFeedback(){
  const { prompt:p, ok, given } = UI.fb, w = BY_ID[p.wordId], e = UI.engine;
  const head = ok ? "Correct" : (given ? "Not quite" : "No answer");
  const pair = '<b>' + esc(w.word) + '</b> — <b>' + esc(w.vi) + '</b>';
  let detail;
  if (ok){
    detail = pair;
  } else {
    detail = (given ? 'You wrote <i>' + esc(given) + '</i>. ' : "") + pair
      + (p.format === "cloze"
          ? '<br><span class="small">' + esc(p.sentence.replace("___", w.word)) + '</span>' : "");
  }
  const extra = ok ? "" :
    '<div class="dl" style="border-top:0;padding-top:10px;margin-top:10px">'
    + '<p class="small">' + esc(w.en) + '</p>'
    + '<ul class="ex small"><li>' + w.examples[0] + '</li></ul></div>';
  const audio = audioButtons(w.id);
  return sessionProgress(e)
    + '<div class="panel"><div class="fb ' + (ok ? "ok" : "no") + '" style="margin-top:0">'
    + '<div class="h">' + head + '</div><div>' + detail + '</div>'
    + '<div style="margin-top:10px">' + audio + '</div>' + extra + '</div>'
    + (ok ? "" : '<p class="tiny muted" style="margin-top:12px">This word will come back in a few questions. '
        + 'Getting it wrong now and fixing it is one of the best things you can do for your memory.</p>')
    + '</div>'
    + '<div class="btn-row end"><button class="btn-primary" type="button" data-act="next" data-autofocus>Continue</button></div>';
}

/* ---- round finished ---- */
function viewRoundDone(){
  const e = UI.engine;
  const isLearn = e.mode === "learn";
  const words = isLearn ? e.words : [];
  const tomorrow = WORDS.filter(w => rec(w.id).due === addDays(today(), 1));
  return '<div class="panel"><h2>' + (isLearn ? "Round finished" : "Review finished") + '</h2>'
    + '<p class="small muted">' + (isLearn
        ? "You recalled each of these four times — from meaning, into English, and inside a sentence."
        : "Your schedule has been updated.") + '</p>'
    + (isLearn ? '<div class="chips" style="margin-top:12px"><span class="chip">'
        + words.map(w => esc(w.word)).join('</span><span class="chip">') + '</span></div>' : "")
    + '<p class="small" style="margin-top:16px">Come back <b>tomorrow</b>: ' + tomorrow.length
    + ' word' + (tomorrow.length === 1 ? "" : "s") + ' will be waiting for review. '
    + 'That delay is not a delay — it is the part that makes the words permanent.</p>'
    + '</div>'
    + '<div class="btn-row"><button class="btn-primary" type="button" data-act="unit" data-autofocus>Back to the word list</button>'
    + (isLearn && nextRound().length ? '<button type="button" data-act="learn">Learn 6 more</button>' : "")
    + (introducedWords().length ? '<button type="button" data-act="test">Take a practice test</button>' : "")
    + '</div>';
}

/* ---- scored test ---- */
function viewTest(){
  const t = UI.test, p = t.items[t.i], w = BY_ID[p.wordId];
  let body = "";
  if (p.format === "mc-meaning"){
    body = '<p class="prompt-q">' + esc(w.word) + '</p><div class="ipa">' + esc(w.ipa) + '</div>'
      + '<div class="choices">'
      + p.options.map((o,i) => '<button class="choice" type="button" data-act="tchoose" data-i="' + i + '"'
          + (i === 0 ? " data-autofocus" : "") + '>' + esc(o.text) + '</button>').join("")
      + '<button class="choice" type="button" data-act="tchoose" data-i="-1">I don\'t know</button></div>';
  } else if (p.format === "type-word"){
    body = '<p class="prompt-q">' + esc(w.vi) + '</p><p class="small muted">' + esc(w.pos) + '</p>' + typedInput("The English word");
  } else if (p.format === "cloze"){
    body = '<p class="prompt-q">' + clozeHTML(p.sentence) + '</p><p class="small muted">' + esc(w.vi) + '</p>'
      + typedInput("The missing word");
  } else if (p.format === "listen-type"){
    body = '<p class="small muted">Write the word you hear.</p>'
      + '<div style="margin:12px 0">'
      + '<button class="speak" type="button" data-act="say" data-id="' + w.id + '" style="margin-left:0">🔊 Play again</button>'
      + '<button class="speak" type="button" data-act="say-slow" data-id="' + w.id + '">🐢 Slowly</button></div>'
      + typedInput("What you heard")
      /* Same escape as in practice: a dead audio path must not cost marks on
         a scored test. Swapping to the meaning keeps the item productive, so
         the score still means what the results table says it means. */
      + '<p class="tiny muted" style="margin-top:12px">Nothing playing? '
      + '<button type="button" data-act="tnoaudio" style="padding:2px 8px;font-size:.78rem;border-radius:8px">'
      + 'Answer from the meaning instead</button></p>';
    setTimeout(() => speak(sayText(w)), 220);
  }
  return progressBar("Question " + (t.i + 1) + " of " + t.items.length, "", (t.i) / t.items.length)
    + '<div class="panel"><div class="kicker">Practice test — no feedback until the end</div>' + body + '</div>'
    + (p.format === "mc-meaning" ? ""
      : '<div class="btn-row end"><button class="btn-primary" type="button" data-act="tsubmit">Next</button></div>');
}
function viewTestResult(){
  const t = UI.test;
  const wrong = t.results.filter(r => !r.ok);
  const pct = Math.round(100 * (t.results.length - wrong.length) / t.results.length);
  const rows = t.results.map(r => {
    const w = BY_ID[r.prompt.wordId];
    return '<tr><td class="mark">' + (r.ok ? "✓" : "✗") + '</td>'
      + '<td><b>' + esc(w.word) + '</b><br><span class="tiny muted">' + esc(w.vi) + '</span></td>'
      + '<td class="tiny">' + (r.ok ? "" : (r.given ? "you wrote: " + esc(r.given) : "no answer")) + '</td></tr>';
  }).join("");
  const repair = wrong.length && t.repairs < 2
    ? '<button type="button" data-act="repair">Practise the ' + wrong.length + ' you missed</button>' : "";
  return '<div class="panel"><h2>Practice test — result</h2>'
    + '<div class="score">' + pct + '%</div>'
    + '<p class="small muted">' + (t.results.length - wrong.length) + ' of ' + t.results.length + ' correct.'
    + (wrong.length ? " The words below with ✗ have been moved back to tomorrow's review."
                    : " Every word is on schedule.") + '</p>'
    + '<table class="res"><thead><tr><th></th><th>Word</th><th>Your answer</th></tr></thead><tbody>'
    + rows + '</tbody></table></div>'
    + '<div class="btn-row"><button class="btn-primary" type="button" data-act="unit" data-autofocus>Back to the word list</button>'
    + '<button type="button" data-act="test">Take a new test</button>' + repair + '</div>'
    + '<p class="tiny muted" style="margin-top:12px">Every test is generated fresh — different questions, different '
    + 'order, different wrong options. Retaking it straight away helps least; coming back tomorrow helps most.</p>';
}

/* ============================================================
   Controller
   ============================================================ */
function startLearn(){
  const r = nextRound();
  if (!r.length) return;
  const words = r.slice(0, NEW_PER_ROUND);
  const t = today();
  for (const w of words){
    const rc = rec(w.id);
    if (!rc.introduced){ rc.introduced = t; rc.due = addDays(t, 1); }
  }
  saveState();
  UI.engine = LearnRound(words);
  advance();
}
function startReview(){
  const due = dueWords();
  if (!due.length) return;
  UI.engine = ReviewRound(due);
  advance();
}
function startTest(words){
  const list = words || introducedWords();
  if (!list.length) return;
  const prev = UI.test;
  UI.test = { items:buildTest(list), i:0, results:[], repairs:prev && words ? prev.repairs + 1 : 0 };
  STATE.testsTaken = (STATE.testsTaken || 0) + 1;
  saveState();
  UI.screen = "test";
  render();
}
function advance(){
  const t = UI.engine.next();
  if (!t){ UI.screen = "roundDone"; render(); return; }
  if (t.kind === "expose"){ UI.screen = "expose"; UI.word = t.word; render(); setTimeout(() => speak(sayText(t.word)), 260); return; }
  UI.prompt = t.prompt; UI.screen = "prompt"; render();
}
function answerPrompt(ok, given){
  UI.engine.record(UI.prompt, ok);
  UI.fb = { prompt:UI.prompt, ok, given };
  UI.screen = "feedback";
  render();
}
function currentTyped(){
  const el = document.getElementById("ans");
  return el ? el.value : "";
}
function submitTyped(){
  const p = UI.prompt, w = BY_ID[p.wordId];
  const given = currentTyped();
  const accept = w.accept;
  answerPrompt(checkTyped(given, accept), given.trim());
}

/* ---- events ---- */
document.addEventListener("click", ev => {
  const b = ev.target.closest("button");
  if (!b) return;
  primeSpeech();   // iOS grants synthesis from inside a gesture; take it early
  const act = b.dataset.act;
  if (act === "say"){ speak(sayText(BY_ID[b.dataset.id])); return; }
  if (act === "say-slow"){ speak(sayText(BY_ID[b.dataset.id]), { slow:true }); return; }
  if (act === "noaudio"){
    UI.prompt = buildPrompt(BY_ID[UI.prompt.wordId], "type-word");
    render();
    return;
  }
  if (act === "tnoaudio"){
    const t = UI.test;
    t.items[t.i] = buildPrompt(BY_ID[t.items[t.i].wordId], "type-word");
    render();
    return;
  }
  if (act === "home"){ UI = { screen:"home" }; render(); return; }
  if (act === "unit"){ UI = { screen:"unit" }; render(); return; }
  if (act === "learn"){ startLearn(); return; }
  if (act === "review"){ startReview(); return; }
  if (act === "test"){ startTest(null); return; }
  if (act === "next"){ advance(); return; }
  if (act === "submit"){ submitTyped(); return; }
  if (act === "reveal"){
    const w = BY_ID[UI.prompt.wordId];
    const panel = b.closest(".panel");
    panel.querySelector(".btn-row").outerHTML =
      '<div class="fb" style="border-color:var(--line)"><div class="h">' + esc(w.vi) + '</div>'
      + '<div class="small muted">' + esc(w.en) + '</div></div>'
      + '<div class="btn-row"><button class="btn-primary" type="button" data-act="selfmark" data-ok="1">I knew it</button>'
      + '<button type="button" data-act="selfmark" data-ok="0">I didn\'t know it</button></div>';
    return;
  }
  if (act === "selfmark"){ answerPrompt(b.dataset.ok === "1", null); return; }
  if (act === "choose"){
    const i = Number(b.dataset.i);
    const opts = UI.prompt.options;
    const ok = i >= 0 && opts[i].ok;
    Array.from(b.parentElement.children).forEach((c, idx) => {
      c.disabled = true;
      if (idx < opts.length && opts[idx].ok) c.classList.add("correct");
      else if (c === b) c.classList.add("wrong");
      else c.classList.add("dim");
    });
    setTimeout(() => answerPrompt(ok, i >= 0 ? opts[i].text : null), 420);
    return;
  }
  if (act === "tchoose"){ const i = Number(b.dataset.i); testAnswer(i); return; }
  if (act === "tsubmit"){ testAnswer(null); return; }
  if (act === "repair"){
    const wrongIds = UI.test.results.filter(r => !r.ok).map(r => r.prompt.wordId);
    startTest(wrongIds.map(id => BY_ID[id]));
    return;
  }
  if (act === "export"){ doExport(); return; }
  if (act === "import"){ doImport(); return; }
  if (act === "reset"){ doReset(); return; }
});
document.addEventListener("keydown", ev => {
  if (ev.key !== "Enter") return;
  if (UI.screen === "prompt" && document.getElementById("ans")){ ev.preventDefault(); submitTyped(); }
  else if (UI.screen === "test" && document.getElementById("ans")){ ev.preventDefault(); testAnswer(null); }
});

function testAnswer(choiceIndex){
  const t = UI.test, p = t.items[t.i], w = BY_ID[p.wordId];
  let ok, given;
  if (p.format === "mc-meaning"){
    ok = choiceIndex >= 0 && p.options[choiceIndex].ok;
    given = choiceIndex >= 0 ? p.options[choiceIndex].text : null;
  } else {
    given = currentTyped().trim();
    ok = checkTyped(given, w.accept);
  }
  grade(p.wordId, ok, ok ? p.dimension : null);
  t.results.push({ prompt:p, ok, given });
  t.i++;
  if (t.i >= t.items.length){ UI.screen = "testResult"; }
  render();
}

/* ---- data management ---- */
function doExport(){
  const blob = new Blob([JSON.stringify(STATE, null, 2)], { type:"application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "unit01-vocab-progress-" + today() + ".json";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function doImport(){
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "application/json,.json";
  inp.onchange = () => {
    const f = inp.files && inp.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      let data;
      try { data = JSON.parse(r.result); }
      catch(e){ alert("That file isn't valid progress data. Choose a file exported from this page."); return; }
      if (!data || data.contentVersion !== CONTENT_VERSION || !data.words){
        alert("That file was exported from a different version of this trainer. It can't be imported.");
        return;
      }
      STATE = data;
      for (const w of WORDS) if (!STATE.words[w.id]) STATE.words[w.id] = blankRecord();
      saveState();
      UI = { screen:"home" }; render();
    };
    r.readAsText(f);
  };
  inp.click();
}
function doReset(){
  if (!confirm("Delete all progress for Unit 1 and start again? This cannot be undone.")) return;
  STATE = { contentVersion:CONTENT_VERSION, words:{}, testsTaken:0, lastSession:null };
  for (const w of WORDS) STATE.words[w.id] = blankRecord();
  saveState();
  UI = { screen:"home" }; render();
}

/* Repaint when a late-arriving voice list changes what the app can offer —
   but only on the home screen, where nothing is half-typed. Mid-session the
   new voice is picked up by the next speak() anyway. */
onVoicesReady = () => { if (UI.screen === "home") render(); };

render();
</script>
