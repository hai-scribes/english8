schema_version: 1

# The executable gate for learn-anywhere.
#
# Five scenarios, one per thing the operator actually asked for, each emitting
# bare `ATELIER_METRIC id=n` numbers on stdout with the unit carried in the id.
#
# Every sweep emits a COVERAGE COUNT beside its result. A harness that drove
# nothing and a harness that found no defects produce identical output
# otherwise, and one is a pass while the other is broken — which is how a
# previous run in this repo shipped a green gate that scanned two pages.
#
# These are real gates and they FAIL today. That is correct: making them green
# is the work, not a precondition to it.

# The whole stack, booted once and torn down once: the static site exactly as
# it ships, plus the Firebase Auth and Firestore emulators.
#
# EVERY PORT IS EPHEMERAL. The static port comes from ATELIER_VARIANT_PORT;
# serve.mjs asks the kernel for the auth, firestore, hub, logging and websocket
# ports and records them in .atelier/harness/ports.json. The emulator's own
# defaults for the last three are the fixed literals 4400/4500/9150, which is
# the collision that makes a second concurrent variant fail for a reason that
# has nothing to do with its work.
#
# The project id is `demo-english8`. Firebase treats a `demo-` prefix as
# emulator-only: it has no cloud counterpart, so this harness cannot reach
# production data and cannot bill anything by construction rather than by care.
serve:
  setup: |
    set -e
    [ -d node_modules ] || npm ci --no-audit --no-fund
    npx --no-install playwright install chromium
    node_modules/.bin/firebase setup:emulators:firestore
  command: "node harness/serve.mjs"
  # ports.json is written only once BOTH emulators answer, so polling for it is
  # polling for a usable stack rather than for a process that has been spawned.
  ready_command: "test -f .atelier/harness/ports.json"
  ready_timeout_seconds: 240
  stop_timeout_seconds: 15

checks:
  # ---------------------------------------------------------------------------
  # The cheap signal, first, so a compile break is reported as a compile break.
  # Runs the repo's own nine gates as well as the build: everything this lane
  # adds lands in the same app.js and build.py that render 103 pages of
  # curriculum, and a sync feature that quietly broke the marking engine would
  # otherwise reach a green interaction gate.
  # ---------------------------------------------------------------------------
  - name: build
    kind: build
    # No `|| true`: node_modules is gitignored, so every tournament variant
    # worktree starts cold. Swallowing a failed install turns it into a missing
    # package a minute later, which reads as a harness defect and sends the
    # worker to fix code that was never broken. A setup failure must fail as
    # setup.
    setup: "[ -d node_modules ] || npm ci --no-audit --no-fund"
    timeout_seconds: 600
    command: "node harness/build.mjs"

  # ---------------------------------------------------------------------------
  # Signing in with Google, driven through the page against the Auth emulator.
  # Driven, not stubbed: calling signInWithCredential from the harness would go
  # green against a page that has no sign-in button on it.
  # ---------------------------------------------------------------------------
  - name: identity
    kind: interaction
    setup: "[ -d node_modules ] || npm ci --no-audit --no-fund"
    timeout_seconds: 600
    command: "node harness/identity.mjs"

  # ---------------------------------------------------------------------------
  # Two browser contexts are two devices. Progress made on one must appear on
  # the other — and progress made by one learner must NOT appear for another.
  # The isolation half runs against the real emulator and the shipped
  # firestore.rules because a rule letting any signed-in user read any document
  # is a defect only the rules engine can catch, and it is the one that exposes
  # a child's work to strangers.
  # ---------------------------------------------------------------------------
  - name: sync
    kind: interaction
    setup: "[ -d node_modules ] || npm ci --no-audit --no-fund"
    timeout_seconds: 900
    command: "node harness/sync.mjs"

  # ---------------------------------------------------------------------------
  # "Save progress, daily, weekly works" — and the constraint that comes with
  # it. The browser's clock is overridden (in the harness, never in the
  # product) so two different days can be exercised in one run; a harness that
  # cannot move the date can only check that today exists, which is the half
  # that never breaks.
  #
  # It also scans for a streak or a score. `tools/assets/app.js` states that
  # rule over the reading log in its own words, and a daily record is exactly
  # where a streak counter would appear. Recording the work is the feature;
  # gamifying it is the defect.
  # ---------------------------------------------------------------------------
  - name: rhythm
    kind: interaction
    setup: "[ -d node_modules ] || npm ci --no-audit --no-fund"
    timeout_seconds: 900
    command: "node harness/rhythm.mjs"

  # ---------------------------------------------------------------------------
  # "No hidden behind-the-scenes process." Measured, not asserted: every
  # request is timestamped against what [data-en8-sync-state] was showing AT
  # THE MOMENT IT LEFT, sampled inside the request handler — a state that
  # flickers back to "synced" before an assertion runs is precisely the hidden
  # process being looked for. Also gates offline, because "learn everywhere"
  # that needs a network is a weaker promise than the one that was made.
  # ---------------------------------------------------------------------------
  - name: session
    kind: interaction
    setup: "[ -d node_modules ] || npm ci --no-audit --no-fund"
    timeout_seconds: 900
    command: "node harness/session.mjs"

  # ---------------------------------------------------------------------------
  # "Instant" as three numbers on a throttled CPU at phone width: p95 click-to-
  # paint, main-thread blocking, and how many backend requests the page waits
  # on before it is usable. The last one targets ZERO and is an architectural
  # claim rather than a tuning one — a local-first page reads its own storage
  # to paint and reconciles afterwards, so no round trip is ever in front of
  # the learner.
  # ---------------------------------------------------------------------------
  - name: speed
    kind: interaction
    setup: "[ -d node_modules ] || npm ci --no-audit --no-fund"
    timeout_seconds: 900
    command: "node harness/speed.mjs"
