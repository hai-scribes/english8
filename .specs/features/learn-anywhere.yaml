entities:
  creates:
  - 'Firestore documents users/{uid}/kv/{id}: id is the localStorage key with every
    character outside A-Z a-z 0-9 _ . - written as ~ and four hex digits (reversible,
    so no two keys share an id); fields are v (the stored string, or null when the
    key was deleted — a deletion is kept as a document, never removed), t (the change
    stamp: a number never earlier than any stamp the writing device has made or seen)
    and s (the server''s time of the write, used only to ask what changed since)'
  - 'learner data: every localStorage key beginning en8: except en8:theme — these
    and only these are uploaded'
  - 'sync bookkeeping: localStorage keys beginning en8-sync: (change stamps, unsent
    keys, read cursor, clock, last config, the marker that an account has used the
    device) — never uploaded'
  - 'held work: localStorage keys beginning en8-sync:parked: — encrypted with a key
    made from the uid, never uploaded, never copied into another account'
  - docs/sw.js, the service worker, stamped with the build's hash
  - docs/precache.json, every published page and asset with a hash of its bytes
  - docs/assets/auth.bundle.js, the bundled Firebase client, and docs/assets/firebase-config.js
  - firestore.rules
  requires:
  - 'Firebase project english8-add68: Auth with the Google provider, Cloud Firestore
    in Standard edition'
  - browser localStorage, Cache Storage, service workers and Web Crypto
  - the per-day record the site keeps under en8:days:v1
addressed_gaps:
- Firestore sync failure displays "Could not save just now. Trying again in a moment."
  but there is no manual retry control.
- Google sign-in failure is only logged to console and repaints signed-out state;
  no visible error text is shown for popup failure.
- The prototype marked the status as a polite live region but asked about signed-out
  work in a browser dialog and never had its new controls checked by keyboard or screen
  reader.
- The prototype's app had no per-day list of path steps; main's record removes a step
  when a lesson is un-marked, which a merge by union would put back.
- The prototype's app had no timed-test mode; the day record and the redraw for incoming
  work were never tried against one.
- The prototype's app kept no per-day review counter; main's is a single number, which
  a later-wins merge would reduce to one device's count.
unaddressed_gaps:
- gap: Which attempt of a task counts as the latest is still decided by each device's
    own clock; both attempts are always kept in the history.
  reason: Whole stored keys are ordered by a stamp that survives a wrong clock, but
    the time inside an attempt record is written by the lesson code. Making it authoritative
    means changing how tasks store attempts, which the second non-goal rules out here;
    it is the first thing to take up in a follow-on.
- gap: A save that fails because the device's storage is full is not announced on
    the page.
  reason: The sync layer keeps a change stamp it could not store in memory for the
    life of the page, so the edit is not mis-merged, but the lesson's own write can
    still fail silently, as it does today without this feature. Announcing it belongs
    to the lesson pages; track it separately.
- gap: A learner cannot delete her account's stored work or export it from the site.
  reason: The prototype has neither. Until it is built, the operator can delete a
    learner's documents in the Firebase console.
- gap: Deletion records are kept in the backend for good.
  reason: A deleted key stays as a document with a null value so that no device brings
    it back. At one learner's volume this never matters; compacting them safely needs
    every device to have seen them.
- gap: No screenshots of the prototype were captured, so design_refs is empty.
  reason: The header controls reuse the existing icon-button and status styles and
    the question reuses the existing card and button styles; the operator may add
    screenshots at review.
- gap: Offline use, signing out with no connection and the pause before a redraw have
    only been tried in a headless browser on a laptop.
  reason: A phone's storage eviction and its own offline detection cannot be asserted
    by a test here; the operator tries it on her devices before release.
