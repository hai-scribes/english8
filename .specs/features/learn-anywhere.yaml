slug: learn-anywhere
status: done
goal: 'A learner signs in with Google and her work follows her across devices: every
  answer, attempt history, note, highlight and piece of writing she makes on one device
  is on her others, the site keeps working with no network and saves when the connection
  returns, every exchange with the backend is announced on the page, and a per-day
  record shows what she did each day of the week. Signing in is optional and changes
  nothing about how lessons work.

  '
problem: 'A grade-8 learner studies alone on weekdays and with a tutor on Saturdays,
  on more than one device and often where the signal drops. Her work lived in one
  browser, so a second device started from nothing. The prototype proved sign-in,
  a local-first sync to Firestore under her own uid, a day record, visible sync states
  and an offline copy of the course — and two outside reviews then found about twenty
  ways that design lost, resurrected or exposed work (sign-out with no network, a
  retake undone by a save, a fast clock overruling later edits, held work readable
  on a shared device, a stale page after a deploy). This spec states the behaviour
  the corrected prototype has, as it must hold on the current app: timed tests that
  show only the test, completion recorded from the work, a per-day record the site
  already keeps, and tasks that commit in different ways — many mark each item as
  it is answered and have no Check button, others (timed, tile, tap) commit through
  their own control. The prototype was built on an app 64 commits older and its gate
  harness presses a Check button, so the tests for these criteria need a task driver
  that uses each task''s own way of committing.

  '
acceptance_criteria:
- id: AC-1
  user_story: as a learner on more than one device, when I click sign in I want Google
    sign-in to start so that my work can follow me
  given: the user is signed out on any page, with sign-in pointed at the Firebase
    Auth emulator
  when: the user clicks "Sign in with Google"
  then: one sign-in popup opens and the auth state reads "signing-in" until it resolves;
    completing it sets the auth state to "signed-in"
  test: test_learn_anywhere_AC1_sign_in_starts
  source: 222ff61cba35f45cea01a6767cb4667b33e0ec31:tools/assets/auth-src.mjs:540
- id: AC-2
  user_story: as a signed-in learner, when I come back to the site I want to still
    be signed in so that I do not sign in every day
  given: the user has signed in with Google
  when: the page is reloaded or another page of the site is opened
  then: the header shows the account's email and a "Sign out" button, the "Sign in
    with Google" button is hidden, and the auth state reads "signed-in" without a
    new popup
  test: test_learn_anywhere_AC2_session_persists_across_pages
  source: 222ff61cba35f45cea01a6767cb4667b33e0ec31:tools/assets/auth-src.mjs:483
- id: AC-3
