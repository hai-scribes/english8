  test: test_learn_anywhere_AC5_every_kind_of_learner_data_syncs
  source: 222ff61cba35f45cea01a6767cb4667b33e0ec31:tools/assets/auth-src.mjs:25
- id: AC-6
  user_story: as a learner, when someone else signs in I want my work to stay mine
    so that nobody reads or changes it
