entities:
  creates:
    - "localStorage key en8:theme"
    - "localStorage key en8:progress:v1"
    - "localStorage key en8:story:v1"
    - "localStorage key en8:review:v1"
    - "localStorage key en8:tasks:v1"
    - "localStorage key en8:calib:v1"
    - "localStorage key prefix en8:played:"
    - "localStorage key prefix en8:clock:"
    - "localStorage key prefix en8:marks:"
    - "localStorage key prefix en8:notes:"
    - "localStorage key prefix en8:flags:"
    - "localStorage key prefix en8:thread:"
    - "localStorage key en8:write:v1"
    - "localStorage key en8:days:v1"
    - "Firestore documents users/{uid}/kv/{encoded localStorage key}"
  requires:
    - "window.__EN8_FIREBASE__ from docs/assets/firebase-config.js"
    - "Firebase Auth"
    - "Firebase Firestore"
    - "browser localStorage"
    - "browser speechSynthesis"

addressed_gaps:
  - "Google sign-in failure is only logged to console and repaints signed-out state; no visible error text is shown for popup failure."
  - "Progress save failure is only logged once to console for en8:progress:v1; no visible error state is shown."
  - "The word lookup has an empty-result message but no recovery beyond the text \"No word matches that. Try part of the word, or the Vietnamese.\""
  - "Firestore sync failure displays \"Could not save just now. Trying again in a moment.\" but there is no manual retry control."
  - "No loading/progress indicator is shown while static lesson content or large word-list HTML is first parsed."
  - "The practice and test buttons use aria-disabled without native disabled on locked unit pages."
  - "Exercise answer reveal buttons are disabled until checking for locked tasks; the prototype does not expose a visible explanation except button title \"Check your answers first.\""

unaddressed_gaps:
  - gap: "No validation screenshot paths were present in the payload or found under .specs/designs, so visual fidelity cannot be captured in design_refs."
    reason: "design_refs is outside this pass's remit and the screenshots do not exist; the operator must supply them at /promote review."
  - gap: "The prototype is generated as static HTML pages with large inline JSON data rather than a production application routing/data layer."
    reason: "This is an architecture decision, not an acceptance criterion; the site is deliberately static, so track it as a separate spec if it is ever revisited."
  - gap: "Speech synthesis support is optional; speak buttons are hidden when no voice is available, and no alternate audio source is implemented."
    reason: "Adding recorded audio is a new feature outside the prototype's surface; the project's own notes say the site has no speech of its own, so this needs an operator decision."

