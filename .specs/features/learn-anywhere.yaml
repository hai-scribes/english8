    key the app writes (progress, tasks, review, story, the per-day record, writing,
    jots, notes, highlights, flags, reading clocks, read-again rounds, word-set and
    practice-bank logs, comic preference, seen words, strand checks)
  when: the saves complete and the same account signs in on a clean device B
  then: every one of those keys holds an equivalent value on B; the colour theme,
