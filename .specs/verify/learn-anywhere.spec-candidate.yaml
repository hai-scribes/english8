prototype_gaps:
  - "No validation screenshot paths were present in the payload or found under .specs/designs, so visual fidelity cannot be captured in design_refs."
  - "The prototype is generated as static HTML pages with large inline JSON data rather than a production application routing/data layer."
  - "The practice and test buttons use aria-disabled without native disabled on locked unit pages."
  - "Google sign-in failure is only logged to console and repaints signed-out state; no visible error text is shown for popup failure."
  - "Progress save failure is only logged once to console for en8:progress:v1; no visible error state is shown."
  - "The word lookup has an empty-result message but no recovery beyond the text \"No word matches that. Try part of the word, or the Vietnamese.\""
  - "Speech synthesis support is optional; speak buttons are hidden when no voice is available, and no alternate audio source is implemented."
  - "Firestore sync failure displays \"Could not save just now. Trying again in a moment.\" but there is no manual retry control."
  - "No loading/progress indicator is shown while static lesson content or large word-list HTML is first parsed."
  - "Exercise answer reveal buttons are disabled until checking for locked tasks; the prototype does not expose a visible explanation except button title \"Check your answers first.\""

ok: true
