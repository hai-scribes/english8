slug: learn-anywhere
status: planned
goal: |
  A learner signs in with Google and her work follows her across devices: every answer, attempt history, note, highlight and piece of writing she makes on one device is on her others, the site keeps working with no network and saves when the connection returns, every exchange with the backend is announced on the page, and a per-day record shows what she did each day of the week. Signing in is optional and changes nothing about how lessons work.
problem: |
  A grade-8 learner studies alone on weekdays and with a tutor on Saturdays, on more than one device and often where the signal drops. Her work lived in one browser, so a second device started from nothing. The prototype proved sign-in, a local-first sync to Firestore under her own uid, a day record, visible sync states and an offline copy of the course — and two outside reviews then found about twenty ways that design lost, resurrected or exposed work (sign-out with no network, a retake undone by a save, a fast clock overruling later edits, held work readable on a shared device, a stale page after a deploy). This spec states the behaviour the corrected prototype has, as it must hold on the current app: tasks that mark each item as it is answered and have no Check button, timed tests that show only the test, completion recorded from the work, and a per-day record the site already keeps. The prototype was built on an app 64 commits older; its gate harness presses a Check button the current app does not have, so the tests for these criteria need a task driver that handles both kinds of task.

acceptance_criteria:
  - id: AC-1
    user_story: "as a learner on more than one device, when I click sign in I want Google sign-in to start so that my work can follow me"
    given: "the user is signed out on any page"
    when: "the user clicks \"Sign in with Google\""
    then: "a Google sign-in popup opens and the auth state reads \"signing-in\" until it resolves"
    test: test_learn_anywhere_AC1_sign_in_starts
    source: "222ff61cba35f45cea01a6767cb4667b33e0ec31:tools/assets/auth-src.mjs:540"
  - id: AC-2
    user_story: "as a signed-in learner, when I come back to the site I want to still be signed in so that I do not sign in every day"
    given: "the user has signed in with Google"
    when: "the page is reloaded or another page of the site is opened"
    then: "the header shows the account's email and a \"Sign out\" button, the \"Sign in with Google\" button is hidden, and the auth state reads \"signed-in\" without a new popup"
    test: test_learn_anywhere_AC2_session_persists_across_pages
    source: "222ff61cba35f45cea01a6767cb4667b33e0ec31:tools/assets/auth-src.mjs:483"
  - id: AC-3
    user_story: "as a learner with a phone and a laptop, when I answer a task on one I want to see it done on the other so that I can carry on anywhere"
    given: "the user answered a marked task twice on device A while signed in, and the page reads \"Saved\""
    when: "the same account signs in on device B, a device with no stored work"
    then: "device B shows that task as done with the same answers, the same marks, the same score line and both attempts in its history, without the user doing anything but sign in"
    test: test_learn_anywhere_AC3_work_follows_account_to_second_device
    source: "222ff61cba35f45cea01a6767cb4667b33e0ec31:tools/assets/auth-src.mjs:304"
  - id: AC-4
    user_story: "as a learner, when someone else signs in I want my work to stay mine so that nobody reads or changes it"
    given: "learner X has synced work and learner Y is a different Google account"
    when: "Y signs in on a clean device, and separately Y's credential is used to read and to write each of X's Firestore documents directly"
    then: "Y's pages show none of X's work as done, Y can read Y's own documents, and every read and write of a document under users/<X's uid> is refused with permission denied"
    test: test_learn_anywhere_AC4_account_isolation_enforced_by_rules
    source: "222ff61cba35f45cea01a6767cb4667b33e0ec31:firestore.rules:5"
  - id: AC-5
    user_story: "as a learner who studies where the signal drops, when I work offline on one device while my other device is online I want both sets of work kept so that neither study session is lost"
    given: "device A is signed in with the lesson open and loses its network; device B is signed in and online"
    when: "the user answers one task on A offline and a different task on B, then A regains its network"
    then: "a third, clean device signing in as the same account shows both tasks and every earlier answer as done"
    test: test_learn_anywhere_AC5_offline_and_concurrent_work_merge
    source: "222ff61cba35f45cea01a6767cb4667b33e0ec31:tools/assets/auth-src.mjs:135"
  - id: AC-6
    user_story: "as a learner, when the site talks to its backend I want the page to say so, so that nothing happens behind my back"
    given: "the user is signed in on a lesson page"
    when: "the user signs in, answers a task, loses the network and regains it"
    then: "the status beside the account reads \"Saving…\" while a save is in flight, \"Saved\" when it lands, \"No connection. Your work is kept on this device and will be saved when you are back online.\" while offline and \"Could not save just now. Trying again in a moment.\" after a failed save; no request leaves for the backend while the status reads idle or \"Saved\""
    test: test_learn_anywhere_AC6_every_backend_request_is_announced
    source: "222ff61cba35f45cea01a6767cb4667b33e0ec31:tools/assets/auth-src.mjs:77"
  - id: AC-7
    user_story: "as a learner, when I open a lesson I want it usable at once so that I never wait on the network to start"
    given: "the user is signed in and has a saved attempt on a lesson"
    when: "that lesson is opened with every backend origin unreachable"
    then: "the lesson's tasks render and the saved attempt is shown as done; nothing in the first paint waits on a backend request"
    test: test_learn_anywhere_AC7_render_path_makes_no_backend_reads
    source: "222ff61cba35f45cea01a6767cb4667b33e0ec31:tools/assets/auth-src.mjs:21"
  - id: AC-8
    user_story: "as a learner on a slow phone, when I answer a task I want the page to respond at once so that sync never makes the lesson feel slow"
    given: "the user is signed in on a lesson page with the CPU throttled four times and a phone-width viewport"
    when: "the user commits forty attempts on a marked task"
    then: "the 95th-percentile time from the committing tap to the next painted frame is at most 100 ms"
    test: test_learn_anywhere_AC8_interaction_stays_instant_with_sync_on
    source: "222ff61cba35f45cea01a6767cb4667b33e0ec31:tools/assets/auth-src.mjs:235"
  - id: AC-9
    user_story: "as a learner, when I finish work I want to see what I did on each day so that I and my Saturday tutor can look back over the week"
    given: "the user answers a marked task at 06:30 local time on one calendar day and another on a later day of the same week, on two devices signed in as the same account"
    when: "either device shows any page that carries the footer"
    then: "a \"Your days\" section lists each local calendar day worked, newest first, grouped under \"Week of <Monday's date>: you worked on <n> days.\", each day naming what was done by kind (for example \"2 tasks answered · 1 word set · 1 piece of writing\"); work done at 06:30 local is filed under that local date, never the UTC one; both days appear on both devices"
    test: test_learn_anywhere_AC9_day_record_lists_local_days_and_week
    source: "222ff61cba35f45cea01a6767cb4667b33e0ec31:tools/assets/app.js:4726"
  - id: AC-10
    user_story: "as a learner, when I spend a day on words, practice or writing I want that day counted so that the record is true"
    given: "the user is on a lesson page"
    when: "the user completes a Meet-the-words set, a practice-bank run, a review session, a timed writing handed in, or a marked task"
    then: "that day's line in \"Your days\" gains that kind of work, drawn from the one per-day record the site already keeps under \"en8:days:v1\" (extended to hold these kinds alongside its review count and path steps); writing is filed once when handed in, not on each keystroke"
    test: test_learn_anywhere_AC10_day_record_counts_every_kind_of_work_in_one_record
    source: "222ff61cba35f45cea01a6767cb4667b33e0ec31:tools/assets/app.js:4718"
  - id: AC-11
    user_story: "as a learner, when I look at my days I want an account of what I did and nothing else so that the record never becomes a scoreboard"
    given: "the user has work on two or more days"
    when: "the \"Your days\" section is shown"
    then: "neither it nor the page shows a streak, \"in a row\", a score, a percentage, points, badges, a level, a best, a comparison, or any minutes, hours or time spent"
    test: test_learn_anywhere_AC11_day_record_shows_no_streak_score_or_time
    source: "222ff61cba35f45cea01a6767cb4667b33e0ec31:tools/assets/app.js:4707"
  - id: AC-12
    user_story: "as a learner sitting a timed test, when the clock is running I want only the test on the page so that nothing distracts me"
    given: "the user has started a timed reading or timed writing"
    when: "the test is running"
    then: "the \"Your days\" section is not visible, and no work arriving from another device redraws the page until the test has ended"
    test: test_learn_anywhere_AC12_timed_test_shows_no_day_record_and_is_never_redrawn
    elevation_class: concurrent
    source_gap: "The prototype's app had no timed-test mode; the day record and the redraw for incoming work were never tried against one."
  - id: AC-13
    user_story: "as a learner on a shared device, when I sign out I want my work saved and then gone from the device so that the next person does not open it"
    given: "the user is signed in with a change still being saved"
    when: "the user clicks \"Sign out\""
    then: "the page shows \"Saving…\", waits up to six seconds for the save, then signs out; the page is drawn again with no task shown as done, and a clean device signing in as the same account shows the change"
    test: test_learn_anywhere_AC13_sign_out_saves_first_then_clears_device
    source: "222ff61cba35f45cea01a6767cb4667b33e0ec31:tools/assets/auth-src.mjs:549"
  - id: AC-14
    user_story: "as a learner with no signal, when I sign out I want my unsaved work kept safe so that signing out never loses it"
    given: "the user is signed in, offline, and has answered a task the backend has not received"
    when: "the user clicks \"Sign out\", then later signs in again on the same device with a connection"
    then: "after sign-out no task is shown as done, the status reads \"Your work is kept on this device. Sign in to see it and save it.\", and the held work cannot be read as plain text from the browser's storage; after signing in again the task is shown as done and it reaches the account's other devices"
    test: test_learn_anywhere_AC14_sign_out_offline_holds_unsaved_work_encrypted
    source: "222ff61cba35f45cea01a6767cb4667b33e0ec31:tools/assets/auth-src.mjs:181"
  - id: AC-15
    user_story: "as a learner, when I delete something offline and sign out I want it to stay deleted so that old work does not come back"
    given: "the user is signed in, offline, and removes a note that was already saved"
    when: "the user signs out and later signs in again with a connection"
    then: "the note is absent on this device and on the account's other devices"
    test: test_learn_anywhere_AC15_deletions_survive_offline_sign_out
    source: "222ff61cba35f45cea01a6767cb4667b33e0ec31:tools/assets/auth-src.mjs:202"
  - id: AC-16
    user_story: "as a learner sharing a device with a sibling, when they sign in after me I want my held work kept from them and kept for me"
    given: "learner X signed out offline with unsaved work held on the device"
    when: "learner Y signs in on that device, uses it, signs out, and X signs in again"
    then: "Y is never shown X's work, X's held work is shown again once X signs in, and if X's unsaved work cannot be held when Y signs in, Y is signed out with \"This device is holding unsaved work for another account. Sign in to that account first.\" and X's work is left untouched"
    test: test_learn_anywhere_AC16_held_work_is_not_given_to_or_destroyed_by_another_account
    source: "222ff61cba35f45cea01a6767cb4667b33e0ec31:tools/assets/auth-src.mjs:486"
  - id: AC-17
    user_story: "as a learner with two tabs open, when I sign out in one I want the other cleared too so that my work is not left on screen"
    given: "the same account is signed in with two tabs open, each showing a task as done"
    when: "the user clicks \"Sign out\" in one tab"
    then: "both tabs end signed out and neither shows the task as done"
    test: test_learn_anywhere_AC17_sign_out_clears_every_tab
    source: "222ff61cba35f45cea01a6767cb4667b33e0ec31:tools/assets/auth-src.mjs:444"
  - id: AC-18
    user_story: "as a learner, when work was done on this device while nobody was signed in I want to choose whether it joins my account so that a sibling's answers do not slip into it"
    given: "an account has been signed in on the device before, the device is now signed out, and someone answers a task"
    when: "an account signs in"
    then: "the user is asked once \"Work was done on this device while nobody was signed in. Add it to your account?\"; if declined, that work appears in no device of the account and is back on the page after sign-out; on a device no account has ever used, signed-out work joins the first account without asking"
    test: test_learn_anywhere_AC18_signed_out_work_joins_an_account_only_when_agreed
    source: "222ff61cba35f45cea01a6767cb4667b33e0ec31:tools/assets/auth-src.mjs:507"
  - id: AC-19
    user_story: "as a learner, when I take a task again I want the fresh attempt to stay fresh so that syncing does not hand my old answers back"
    given: "the user has an answered, saved task"
    when: "the user clicks \"Try it again\" and the save completes"
    then: "the stored record for the task has no answers and keeps the history of the first attempt, and the account's other devices show the task as not done"
    test: test_learn_anywhere_AC19_retake_is_not_undone_by_sync
    source: "222ff61cba35f45cea01a6767cb4667b33e0ec31:tools/assets/app.js:1559"
  - id: AC-20
    user_story: "as a learner whose phone clock is wrong, when I change something later on another device I want the later change to win so that a wrong clock cannot overrule me"
    given: "device A's clock is two days ahead and has saved a note; device B has a correct clock and has received it"
    when: "the user changes the note on B and the save completes"
    then: "B keeps the later text and a third device receives the later text"
    test: test_learn_anywhere_AC20_fast_clock_does_not_overrule_later_change
    source: "222ff61cba35f45cea01a6767cb4667b33e0ec31:tools/assets/auth-src.mjs:61"
  - id: AC-21
    user_story: "as a learner, when I remove something I want it to stay removed on every device so that syncing never puts it back"
    given: "the user is signed in and has saved highlights, a lesson marked finished, and reviewed items on a day"
    when: "the user removes a highlight, or un-finishes a lesson, or reviews items offline on two devices, and the saves complete"
    then: "the removed highlight and the un-finished lesson stay removed on this device and the account's other devices, the read-again rounds are never merged by position into rounds nobody ran, and the day's reviewed count includes the items reviewed on both devices"
    test: test_learn_anywhere_AC21_edited_lists_and_counters_merge_without_resurrection
    source: "222ff61cba35f45cea01a6767cb4667b33e0ec31:tools/assets/auth-src.mjs:134"
  - id: AC-22
    user_story: "as a learner in the middle of an answer, when work arrives from my other device I want the page left alone so that I never lose what I am doing"
    given: "the user is signed in on a lesson and has chosen answers not yet committed, or has a practice run open, or is typing in a text field, or touched the lesson in the last thirty seconds"
    when: "work from another device arrives and is saved to this device"
    then: "the page is not drawn again; the status reads \"Saved. Work from your other device will show on the next page you open.\"; once none of those holds the page is drawn again showing that work, and the user's own committed answers are still shown"
    test: test_learn_anywhere_AC22_incoming_work_never_redraws_under_her_hands
    source: "222ff61cba35f45cea01a6767cb4667b33e0ec31:tools/assets/auth-src.mjs:250"
  - id: AC-23
    user_story: "as the person paying for the backend, when a learner works for an hour I want the reads and writes to stay small so that the free plan is enough"
    given: "the user is signed in with several hundred saved keys and the device has synced before"
    when: "the user makes one change and the save completes"
    then: "the save reads only documents changed in the backend since this device's last read (plus the changed key), not the whole account; the whole account is read on a device's first sync and at most once a day after; no batch exceeds 500 writes; and a failing save retries after 8 seconds, doubling up to 5 minutes"
    test: test_learn_anywhere_AC23_sync_reads_only_what_changed
    source: "222ff61cba35f45cea01a6767cb4667b33e0ec31:tools/assets/auth-src.mjs:322"
  - id: AC-24
    user_story: "as a learner going somewhere with no signal, when I have opened the site once I want every lesson available so that I can study anywhere"
    given: "the user has opened any one page of the site online and the course has finished saving"
    when: "the device is offline and the user opens a lesson never opened before"
    then: "the lesson loads with its tasks working and its drawings shown; a device set to save data keeps only the pages it opens"
    test: test_learn_anywhere_AC24_whole_course_loads_offline
    source: "222ff61cba35f45cea01a6767cb4667b33e0ec31:tools/sw.js:82"
  - id: AC-25
    user_story: "as a learner on a bad connection, when the network neither answers nor fails I want the saved lesson shown so that I am not left on a blank page"
    given: "a lesson is saved on the device and its request to the network hangs"
    when: "the user opens the lesson"
    then: "the saved lesson appears within 8 seconds with its tasks working"
    test: test_learn_anywhere_AC25_hanging_connection_falls_back_to_saved_lesson
    source: "222ff61cba35f45cea01a6767cb4667b33e0ec31:tools/sw.js:23"
  - id: AC-26
    user_story: "as a learner, when the site is updated I want the new version on my device so that I am never stuck on an old build or a broken mix of two"
    given: "a device holds the previous build, including a lesson opened under it"
    when: "a new build is published and the user opens the site online, then goes offline"
    then: "the new build is running within three ordinary reloads; offline, every lesson is the new build's page with the new build's scripts, whichever address form it is opened by; files the new build retired are no longer kept"
    test: test_learn_anywhere_AC26_new_build_replaces_saved_copy_without_mixing
    source: "222ff61cba35f45cea01a6767cb4667b33e0ec31:tools/sw.js:37"
  - id: AC-27
    user_story: "as a signed-in learner opening the site offline, when the sign-in settings cannot be fetched I want to still see that I am signed in and offline so that I am not shown a button that cannot work"
    given: "the user signed in earlier and opens a saved page with no network"
    when: "the page loads"
    then: "the header shows the account and the offline status, not a \"Sign in with Google\" button that does nothing"
    test: test_learn_anywhere_AC27_offline_page_shows_account_and_offline_state
    source: "222ff61cba35f45cea01a6767cb4667b33e0ec31:tools/assets/auth-src.mjs:230"
  - id: AC-28
    user_story: "as a learner whose sign-in popup fails or is closed, when sign-in does not complete I want to be told so that I know I am still signed out and can try again"
    given: "the user is signed out and has clicked \"Sign in with Google\""
    when: "the popup is blocked, closed, or the network is unreachable"
    then: "the auth state returns to signed-out and a visible message appears beside the button: \"Could not sign in. Check your connection and try again.\"; the button is enabled again and local work is unchanged"
    test: test_learn_anywhere_AC28_sign_in_failure_shows_message
    elevation_class: error_state
    source_gap: "Google sign-in failure is only logged to console and repaints signed-out state; no visible error text is shown for popup failure."
  - id: AC-29
    user_story: "as a learner, when I click sign in twice quickly I want only one sign-in attempt so that I do not get stacked popups"
    given: "the auth state is \"signing-in\""
    when: "the user clicks \"Sign in with Google\" again within the same attempt"
    then: "the second click is ignored and only one popup is open until the attempt resolves"
    test: test_learn_anywhere_AC29_sign_in_double_click_ignored
    elevation_class: concurrent
    source_gap: implicit
  - id: AC-30
    user_story: "as a learner whose save keeps failing, when the error appears I want a way to retry so that I do not have to wait or reload"
    given: "a save has failed and \"Could not save just now. Trying again in a moment.\" is shown"
    when: "the user activates the \"Try again\" button shown beside that message"
    then: "the save is retried immediately, the message clears on success, and on another failure the message stays with the button enabled"
    test: test_learn_anywhere_AC30_sync_failure_manual_retry
    elevation_class: error_state
    source_gap: "Firestore sync failure displays \"Could not save just now. Trying again in a moment.\" but there is no manual retry control."

non_goals:
  - "Google is the only way to sign in: no other sign-in providers, no email and password, and no teacher or parent view of her data."
  - "Nothing about how lessons work on the current app is changed by this feature: marking, completion, timed tests, the six-lesson shape, the practice pools and the review queue behave exactly as they do without it."

ui_contract:
  elements:
    - role: button
      name: "Sign in with Google"
      actions: ["click", "keyboard-enter"]
      source_screenshot: ""
    - role: button
      name: "Sign out"
      actions: ["click", "keyboard-enter"]
      source_screenshot: ""
    - role: button
      name: "Try again"
      actions: ["click", "keyboard-enter"]
      source_screenshot: ""

design_refs: []

entities:
  creates:
    - "Firestore documents users/{uid}/kv/{encoded localStorage key}, each holding the value, a change stamp and a server time"
    - "localStorage keys under the prefix en8-sync: (change stamps, unsent keys, read cursor, clock, held work)"
    - "docs/sw.js, the service worker, stamped with the build's hash"
    - "docs/precache.json, every published page and asset with a hash of its bytes"
    - "docs/assets/auth.bundle.js, the bundled Firebase client"
    - "firestore.rules"
  requires:
    - "window.__EN8_FIREBASE__ from docs/assets/firebase-config.js (project english8-add68)"
    - "Firebase Auth with the Google provider"
    - "Cloud Firestore, Standard edition"
    - "browser localStorage, Cache Storage, service workers and Web Crypto"
    - "the per-day record the site keeps under en8:days:v1"

addressed_gaps:
  - "Google sign-in failure is only logged to console and repaints signed-out state; no visible error text is shown for popup failure."
  - "Firestore sync failure displays \"Could not save just now. Trying again in a moment.\" but there is no manual retry control."
  - "The prototype's app had no timed-test mode; the day record and the redraw for incoming work were never tried against one."

unaddressed_gaps:
  - gap: "Which attempt of a task counts as the latest is still decided by each device's own clock; both attempts are always kept in the history."
    reason: "The prototype orders whole stored keys by a stamp that survives a wrong clock, but the time inside an attempt record is the app's own. Changing it reaches into how tasks are stored, which this feature does not alter."
  - gap: "A save that fails because the device's storage is full is not announced on the page."
    reason: "The elevator proposed a message tied to a lesson-complete button the current app no longer has. Storage-full handling belongs to the lesson pages and is outside this feature's non-goals; track it separately."
  - gap: "The question about adding signed-out work uses the browser's own confirm box."
    reason: "It works and is tested, but it has had no design pass; DESIGN.md has no pattern for a question to the learner yet."
  - gap: "No screenshots of the prototype were captured, so design_refs is empty."
    reason: "The header controls reuse the existing icon-button and status styles; the operator may add screenshots at review."
  - gap: "Offline use, signing out with no connection and the pause before a redraw have only been tried in a headless browser on a laptop."
    reason: "Real-device behaviour (a phone's storage eviction, its own offline detection) cannot be asserted by a test here; the operator tries it on her devices before release."

elevation_summary:
  ac_count_before: 7
  ac_count_after: 30
  classes_added: [error_state, concurrent]
  cross_family_check: |
    Extract ran on openai and elevate on anthropic. The operator then had the criteria rewritten at /promote review (2026-10-12): the extracted criteria described the whole site as it stood on the prototype's older app, several against decisions since made on main, and covered almost none of the feature.

ok: true
